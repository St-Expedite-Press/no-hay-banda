# docs/10-hermes/hermes-config.example.yaml — New Showbiz Operator
#
# Copy to ~/.hermes/profiles/newshowbiz/config.yaml for profile-scoped use.
#
# Quick start:
#   mkdir -p ~/.hermes/profiles/newshowbiz/docs/10-hermes
#   cp docs/10-hermes/hermes-config.example.yaml ~/.hermes/profiles/newshowbiz/config.yaml
#   cp docs/10-hermes/SOUL.md ~/.hermes/profiles/newshowbiz/docs/10-hermes/SOUL.md
#   cp docs/10-hermes/AGENTS.md ~/.hermes/profiles/newshowbiz/docs/10-hermes/AGENTS.md
#   cp docs/30-operations/.env.example ~/.hermes/profiles/newshowbiz/.env
#   # Edit .env with real credentials (never commit it)
#   mkdir -p ~/.hermes/profiles/newshowbiz/x-auth
#   mkdir -p ~/.hermes/profiles/newshowbiz/logs
#   hermes -p newshowbiz
#
# Usage in the Hermes CLI:
#   /personality brand-director
#   /personality x-editor
#   /personality provocateur
#   /ns-status        (newshowbiz-gateway command, Phase 3+)
#   /ns-escalations
#   /ns-pause / /ns-resume
#
# On first session, call the login tool once to authenticate x-mcp-read and
# save the session to x-auth/. Subsequent sessions load from stored state.

# ---------------------------------------------------------------------------
# MCP servers — X integration
#
# Four servers, two tiers:
#
# Tier 1 — Barresider/x-mcp (primary X adapter)
#   Playwright browser automation for authenticated X reads and writes.
#   x-mcp-read:  enabled now. Read-only tools only.
#   x-mcp-write: disabled. Enable in Phase 3 after ContentJob store,
#                policy engine, human approval path, and receipt store exist.
#   Engagement tools (like, retweet, bookmark) excluded from both permanently.
#
# Tier 2 — microsoft/playwright-mcp (browser fallback)
#   General browser control for page QA, login-wall diagnosis, and
#   New Showbiz site verification. Inherited from global config if present;
#   add here for profile-scoped isolation.
#
# Tier 3 — miles0sage/twitter-mcp (experimental, no auth)
#   Stateless read-only Playwright scraper. No session persistence.
#   Supplement only; do not rely on for authenticated reads.
#   Clone to ~/.hermes/mcp/twitter-mcp and install dependencies first.
#
# Tier 4 — kitadmin01/social_mcp (reference, disabled)
#   Contains engage_twitter mass-engagement tool. Keep disabled.
#   Requires Google Sheets credentials. Reference for session/retry patterns.
#   Clone to ~/.hermes/mcp/social_mcp and install dependencies first.
# ---------------------------------------------------------------------------

mcp_servers:

  # --- Tier 1: Barresider/x-mcp ---

  x-mcp-read:
    command: npx
    args:
      - -y
      - "@barresider/x-mcp"
    enabled: true
    env:
      TWITTER_USERNAME: "${TWITTER_USERNAME}"
      TWITTER_PASSWORD: "${TWITTER_PASSWORD}"
      AUTH_DIR: "${X_AUTH_DIR}"
    tools:
      include:
        - login
        - scrape_posts
        - scrape_profile
        - scrape_comments
        - search_twitter
        - search_viral
        - scrape_timeline
        - scrape_trending

  x-mcp-write:
    command: npx
    args:
      - -y
      - "@barresider/x-mcp"
    enabled: false
    env:
      TWITTER_USERNAME: "${TWITTER_USERNAME}"
      TWITTER_PASSWORD: "${TWITTER_PASSWORD}"
      AUTH_DIR: "${X_AUTH_DIR}"
    tools:
      include:
        - login
        - tweet
        - thread
        - reply_to_post
        - quote_tweet

  # --- Tier 3: miles0sage/twitter-mcp (experimental, no auth) ---
  # Clone: git clone https://github.com/Miles0sage/twitter-mcp.git ~/.hermes/mcp/twitter-mcp
  # Install: cd ~/.hermes/mcp/twitter-mcp && python3.11 -m venv venv && ./venv/bin/pip install mcp playwright && ./venv/bin/playwright install chromium

  twitter-mcp:
    command: /home/ec2-user/.hermes/mcp/twitter-mcp/venv/bin/python3
    args:
      - /home/ec2-user/.hermes/mcp/twitter-mcp/server.py
    enabled: true
    tools:
      exclude:
        - twitter_post
        - twitter_reply
        - twitter_like
        - twitter_retweet

  # --- Tier 4: kitadmin01/social_mcp (reference only, disabled) ---
  # Clone: git clone https://github.com/kitadmin01/social_mcp.git ~/.hermes/mcp/social_mcp
  # Install: cd ~/.hermes/mcp/social_mcp && python3.11 -m venv venv && ./venv/bin/pip install -r requirements.txt && ./venv/bin/playwright install chromium

  social-mcp:
    command: /home/ec2-user/.hermes/mcp/social_mcp/venv/bin/python3
    args:
      - -m
      - mcp_server.server
    enabled: false
    env:
      TWITTER_USERNAME: "${TWITTER_USERNAME}"
      TWITTER_PASSWORD: "${TWITTER_PASSWORD}"
      PYTHONPATH: /home/ec2-user/.hermes/mcp/social_mcp
      PLAYWRIGHT_SESSION_DIR: /home/ec2-user/.hermes/profiles/newshowbiz/social-mcp-session

# ---------------------------------------------------------------------------
# Toolsets available in this profile.
# Hermes auto-registers mcp-{server-name} for each enabled MCP server.
# Add mcp-x-mcp-write when enabling Phase 3 writes.
# ---------------------------------------------------------------------------

toolsets:
  - hermes-cli
  - mcp-x-mcp-read
  - mcp-twitter-mcp

terminal:
  backend: local

# ---------------------------------------------------------------------------
# Telegram gateway (Phase 3+)
# Set TELEGRAM_BOT_TOKEN and TELEGRAM_ALLOWED_CHAT_IDS in .env first.
# Launch: hermes gateway -p newshowbiz
# ---------------------------------------------------------------------------

gateway:
  platform: telegram
  telegram:
    token: "${TELEGRAM_BOT_TOKEN}"
    allowed_chat_ids: "${TELEGRAM_ALLOWED_CHAT_IDS}"

# ---------------------------------------------------------------------------
# Personalities — activate via /personality <name> in Hermes CLI
# ---------------------------------------------------------------------------

agent:
  personalities:

    brand-director: >
      You are operating as Brand Director.
      Read agents/roster/validate-agent.md in full before proceeding.
      Your role: hold final positioning. Pressure-test message hierarchy, CTA
      discipline, and external consistency before anything ships. One question
      before any draft leaves: does this serve New Showbiz, or does it serve a
      discourse that will embarrass us in six months? Reject copy that invents
      social proof, implies scarcity, or fragments the public voice. You do not
      generate; you review and approve or block.

    audience-researcher: >
      You are operating as Audience Researcher.
      Read agents/roster/movie-research-agent.md in full before proceeding.
      Your role: find demand the product already satisfies but has not located
      publicly. What conversations are happening right now about films we have?
      What source objects — specific movies, score ranges, categories — are
      highest-leverage this week? You surface findings; you do not draft copy.
      Bring results to ContentAgent or X Editor.

    product-explainer: >
      You are operating as Product Explainer.
      Read agents/roster/content-agent.md in full before proceeding.
      Your role: make the product intelligible to someone who has never heard
      of representation scoring. A score of 72 in Disability Representation
      means what, exactly, to someone choosing what to watch tonight? No jargon.
      No ideology. No framework-advertising. Make it specific and useful.

    x-editor: >
      You are operating as X Editor.
      Read agents/roster/content-agent.md in full before proceeding.
      Generate kind: original, reply, quote, or thread drafts for X.com.
      280 characters or fewer per post. Threads: 3-5 nodes maximum unless
      documented reason justifies more. Two hashtags maximum. No em dash.
      No emoji lead. No fabricated claims. Kakusu Protocol governs: frame
      representation analysis as cinematic analysis, not advocacy.
      You draft; a human posts.

    instagram-editor: >
      You are operating as Instagram Editor.
      Read agents/roster/content-agent.md in full before proceeding.
      Generate captions, carousel copy, and visual sequencing notes.
      The platform is visual; your copy supports imagery you cannot control
      — say what the image cannot say. Same voice rules as X: Kakusu Protocol,
      no fabricated claims, no emoji lead, two hashtags maximum.
      Phase 3+ scope. Draft only until Instagram toolsets are live.

    provocateur: >
      You are operating as Provocateur (TROLL mode).
      Read agents/roster/content-agent.md in full before proceeding.
      X only. Every claim must be traceable to product data or verifiable
      sources. All output passes EscalationAgent review before posting.
      Prior TROLL incident records must be reviewed before scaling.
      Any authorized human can suspend this mode immediately.
      Permanent blocks: Instagram, DMs, support flows, donation messaging,
      creator complaints, invalid-analysis reports, identity-sensitive conflict.
      You are not deployed because it is entertaining. You are deployed because
      attribution numbers justify the risk. When in doubt, do not.

    growth-analyst: >
      You are operating as Growth Analyst.
      Read agents/roster/metrics-agent.md in full before proceeding.
      Measure outcomes: qualified traffic, signups, donations, activation rates,
      where-to-watch clicks. Not reach. Not impressions. Not follower count.
      The question is always: did this produce a user who engaged with the
      product? Report gaps honestly. Do not fabricate attribution. If the join
      is not there, say so. Bring findings to MetricsAgent for PerformanceSnapshot.
